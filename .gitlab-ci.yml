variables:
  FF_NETWORK_PER_BUILD: "true"

stages:
  - verify
  - build
  - notification

verify:
  stage: verify
  image: node:20-alpine
  script:
    - npm ci
    - npm run typecheck
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - export IMAGE_VERSION_TAG="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)"
    - test -n "$IMAGE_VERSION_TAG"
    - export IMAGE_DESTINATIONS="--destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA --destination $CI_REGISTRY_IMAGE:latest --destination $CI_REGISTRY_IMAGE:$IMAGE_VERSION_TAG"
    - if [ "$CI_COMMIT_BRANCH" = "dev" ]; then export IMAGE_DESTINATIONS="$IMAGE_DESTINATIONS --destination $CI_REGISTRY_IMAGE:dev"; fi
    - |
      mkdir -p /tmp
      wget -S -q -O /tmp/registry-repositories.json \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories" 2>/tmp/repos-headers.txt || true
      repos_status="$(sed -n 's/.*HTTP\/[0-9.]* \([0-9][0-9][0-9]\).*/\1/p' /tmp/repos-headers.txt | tail -n 1)"
      if [ "$repos_status" != "200" ]; then
        echo "Could not verify existing container tags through GitLab API (HTTP ${repos_status:-unknown})."
        cat /tmp/repos-headers.txt || true
        exit 1
      fi

      registry_repository_id="$(sed -n 's/.*"id":\([0-9][0-9]*\).*/\1/p' /tmp/registry-repositories.json | head -n 1)"
      if [ -n "$registry_repository_id" ]; then
        wget -S -q -O /tmp/registry-version-tag.json \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories/$registry_repository_id/tags/$IMAGE_VERSION_TAG" 2>/tmp/tag-headers.txt || true
        tag_status="$(sed -n 's/.*HTTP\/[0-9.]* \([0-9][0-9][0-9]\).*/\1/p' /tmp/tag-headers.txt | tail -n 1)"
        case "$tag_status" in
          200)
            echo "Container release tag '$IMAGE_VERSION_TAG' already exists. Bump package.json before publishing another release image."
            exit 1
            ;;
          404)
            echo "Container release tag '$IMAGE_VERSION_TAG' is available."
            ;;
          *)
            echo "Could not verify container release tag '$IMAGE_VERSION_TAG' (HTTP ${tag_status:-unknown})."
            exit 1
            ;;
        esac
      else
        echo "No existing container registry repository found; release tag '$IMAGE_VERSION_TAG' is available."
      fi
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      $IMAGE_DESTINATIONS
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'

success_notification:
  stage: notification
  image: alpine:3.20
  script:
    - apk add curl git
    - wget https://gitlab.mdbook.me/mikayla/scripts/-/raw/master/ci-discord-hook.sh
    - chmod +x ci-discord-hook.sh
    - /bin/sh ci-discord-hook.sh success $WEBHOOK_URL
  when: on_success

failure_notification:
  stage: notification
  image: alpine:3.20
  script:
    - apk add curl git
    - wget https://gitlab.mdbook.me/mikayla/scripts/-/raw/master/ci-discord-hook.sh
    - chmod +x ci-discord-hook.sh
    - /bin/sh ci-discord-hook.sh failure $WEBHOOK_URL
  when: on_failure
