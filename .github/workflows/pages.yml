name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Opt every JS-based action in this workflow into the Node.js 24 runtime.
# Node.js 20 actions were deprecated 2025-09-19 and become non-default on
# 2026-06-02. Per https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
# the supported opt-in is this env var; the action versions themselves
# (checkout@v4, setup-node@v4, upload-pages-artifact@v3, deploy-pages@v4)
# do not need bumping. This does not affect `setup-node`'s `node-version`
# below, which controls the Node we use to build the app.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
